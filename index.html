
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KickOff — Jadwal Bola WIB</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b1120;
  color:#f1f5f9;
  font-family:Arial,sans-serif;
}
header{
  padding:24px 18px;
  background:#111c31;
  border-bottom:1px solid #26344c;
}
.container{max-width:950px;margin:auto}
.brand{font-size:27px;font-weight:800;color:#38bdf8}
.brand span{color:white}
.subtitle{color:#94a3b8;font-size:13px;margin-top:6px}
main{max-width:950px;margin:22px auto;padding:0 14px}
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-bottom:16px;
}
button,select,input{
  border:1px solid #334155;
  border-radius:9px;
  background:#172338;
  color:#f1f5f9;
  padding:11px 14px;
  font-size:14px;
}
button{cursor:pointer}
button.active{
  background:#0284c7;
  border-color:#0284c7;
}
input{flex:1;min-width:170px}
select{min-width:150px}
button:disabled{opacity:.5}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 0 12px;
}
.section-title h2{font-size:18px;margin:0}
.muted{color:#94a3b8;font-size:12px}
.match{
  background:#131f33;
  border:1px solid #26364e;
  border-radius:12px;
  padding:15px;
  margin-bottom:11px;
}
.league{
  display:flex;
  align-items:center;
  gap:8px;
  color:#94a3b8;
  font-size:12px;
  margin-bottom:15px;
}
.league img{width:20px;height:20px;object-fit:contain}
.match-content{
  display:grid;
  grid-template-columns:1fr 100px 1fr;
  align-items:center;
  gap:8px;
}
.team{text-align:center;font-size:14px;font-weight:600}
.team img{
  display:block;
  width:38px;
  height:38px;
  object-fit:contain;
  margin:0 auto 8px;
}
.score{text-align:center}
.score-number{font-size:24px;font-weight:800}
.time{font-size:12px;color:#38bdf8;margin-top:5px}
.status{font-size:11px;color:#94a3b8;margin-top:5px}
.empty,.loading,.error{
  text-align:center;
  padding:35px 15px;
  background:#131f33;
  border-radius:12px;
  color:#94a3b8;
}
.error{color:#fca5a5}
footer{
  text-align:center;
  padding:25px 15px;
  color:#64748b;
  font-size:12px;
  border-top:1px solid #26344c;
  margin-top:35px;
}
.social-links{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:14px;
}
.social-links a{
  color:#38bdf8;
  text-decoration:none;
  font-weight:bold;
}
.social-links a:hover{color:white}
@media(max-width:500px){
  .match-content{grid-template-columns:1fr 75px 1fr}
  .team{font-size:12px}
  .score-number{font-size:21px}
  button,select,input{font-size:13px}
}
</style>
</head>

<body>

<header>
  <div class="container">
    <div class="brand">⚽ Kick<span>Off</span></div>
    <div class="subtitle">Jadwal pertandingan sepak bola · Waktu Indonesia Barat</div>
  </div>
</header>

<main>
  <div class="toolbar">
    <button id="todayBtn" class="active">Hari Ini</button>
    <button id="refreshBtn">↻ Refresh</button>
  </div>

  <div class="toolbar">
    <input id="searchInput" type="search" placeholder="Cari tim atau liga...">
    <select id="leagueFilter">
      <option value="all">Semua Liga</option>
    </select>
  </div>

  <div class="section-title">
    <h2 id="dateTitle">Jadwal Pertandingan</h2>
    <span class="muted" id="matchCount">Memuat...</span>
  </div>

  <div id="matches">
    <div class="loading">Memuat jadwal pertandingan...</div>
  </div>
</main>

<footer>
  <div>KickOff · Jadwal Bola WIB</div>
  <div class="social-links">
    <a href="https://youtube.com/@quotesfin_id"
       target="_blank" rel="noopener noreferrer">YouTube</a>

    <a href="https://www.tiktok.com/@muhamad.alfin.2009"
       target="_blank" rel="noopener noreferrer">TikTok</a>
  </div>
  <div style="margin-top:12px">© 2026 KickOff</div>
</footer>

<script>
const API = "/.netlify/functions/fixtures";

let allMatches = [];

const matchesEl = document.getElementById("matches");
const dateTitle = document.getElementById("dateTitle");
const matchCount = document.getElementById("matchCount");
const searchInput = document.getElementById("searchInput");
const leagueFilter = document.getElementById("leagueFilter");

function dateKey(date){
  const parts = new Intl.DateTimeFormat("en-GB",{
    timeZone:"Asia/Jakarta",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  }).formatToParts(date);

  const p = {};
  parts.forEach(item => p[item.type] = item.value);

  return `${p.year}-${p.month}-${p.day}`;
}

function formatDate(dateString){
  const [year,month,day] = dateString.split("-").map(Number);
  const date = new Date(year,month-1,day);

  return new Intl.DateTimeFormat("id-ID",{
    weekday:"long",
    day:"numeric",
    month:"long",
    year:"numeric"
  }).format(date);
}

function formatTime(dateString){
  return new Intl.DateTimeFormat("id-ID",{
    timeZone:"Asia/Jakarta",
    hour:"2-digit",
    minute:"2-digit",
    hour12:false
  }).format(new Date(dateString)) + " WIB";
}

function getStatus(match){
  const status = match.fixture.status;
  const code = status.short;

  if(["1H","2H","ET","P","LIVE"].includes(code)){
    return status.elapsed ? `LIVE ${status.elapsed}'` : "LIVE";
  }

  if(code === "HT") return "ISTIRAHAT";
  if(code === "FT") return "SELESAI";
  if(code === "PST") return "DITUNDA";
  if(code === "CANC") return "DIBATALKAN";
  if(code === "ABD") return "DIHENTIKAN";
  if(code === "NS") return formatTime(match.fixture.date);

  return status.long || code;
}

async function fetchDate(date){
  const url = API + "?date=" + encodeURIComponent(date);

  const response = await fetch(url,{
    headers:{"Accept":"application/json"}
  });

  const data = await response.json();

  if(!response.ok){
    throw new Error(data.error || "Gagal mengambil jadwal pertandingan.");
  }

  if(data.errors && Object.keys(data.errors).length){
    throw new Error(JSON.stringify(data.errors));
  }

  return data.response || [];
}

function updateLeagueOptions(matches){
  const current = leagueFilter.value;

  const leagues = [...new Map(
    matches.map(match => [
      match.league.id,
      {
        id:match.league.id,
        name:match.league.name
      }
    ])
  ).values()].sort((a,b)=>a.name.localeCompare(b.name));

  leagueFilter.innerHTML =
    '<option value="all">Semua Liga</option>';

  leagues.forEach(league=>{
    const option = document.createElement("option");
    option.value = league.id;
    option.textContent = league.name;
    leagueFilter.appendChild(option);
  });

  if(leagues.some(league=>String(league.id)===current)){
    leagueFilter.value = current;
  }
}

function renderMatches(){
  const search = searchInput.value.toLowerCase().trim();
  const selectedLeague = leagueFilter.value;

  if(!allMatches.length){
    matchesEl.innerHTML =
      '<div class="empty">Maaf, hari ini gak ada jadwal, Foundernya kere 😂</div>';

    matchCount.textContent = "0 pertandingan";
    return;
  }

  const filtered = allMatches.filter(match=>{
    const home = match.teams.home.name.toLowerCase();
    const away = match.teams.away.name.toLowerCase();
    const league = match.league.name.toLowerCase();

    const matchesSearch =
      home.includes(search) ||
      away.includes(search) ||
      league.includes(search);

    const matchesLeague =
      selectedLeague === "all" ||
      String(match.league.id) === selectedLeague;

    return matchesSearch && matchesLeague;
  });

  matchCount.textContent = `${filtered.length} pertandingan`;

  if(!filtered.length){
    matchesEl.innerHTML =
      '<div class="empty">Tidak ada pertandingan yang cocok dengan pencarian.</div>';
    return;
  }

  matchesEl.innerHTML = filtered.map(match=>{
    const league = match.league;
    const home = match.teams.home;
    const away = match.teams.away;

    const homeScore = match.goals.home;
    const awayScore = match.goals.away;

    const hasScore = homeScore !== null && awayScore !== null;
    const score = hasScore
      ? `${homeScore} - ${awayScore}`
      : "VS";

    return `
      <div class="match">
        <div class="league">
          ${league.logo ? `<img src="${league.logo}" alt="">` : ""}
          <span>${league.name} · ${league.country || ""}</span>
        </div>

        <div class="match-content">
          <div class="team">
            ${home.logo ? `<img src="${home.logo}" alt="">` : ""}
            <div>${home.name}</div>
          </div>

          <div class="score">
            <div class="score-number">${score}</div>
            <div class="status">${getStatus(match)}</div>
          </div>

          <div class="team">
            ${away.logo ? `<img src="${away.logo}" alt="">` : ""}
            <div>${away.name}</div>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

async function load(){
  matchesEl.innerHTML =
    '<div class="loading">Memuat jadwal pertandingan...</div>';

  matchCount.textContent = "Memuat...";

  const today = dateKey(new Date());
  dateTitle.textContent = formatDate(today);

  try{
    allMatches = await fetchDate(today);

    allMatches.sort((a,b)=>
      new Date(a.fixture.date)-new Date(b.fixture.date)
    );

    updateLeagueOptions(allMatches);
    renderMatches();

  }catch(error){
    matchesEl.innerHTML =
      `<div class="error">${error.message}</div>`;

    matchCount.textContent = "Gagal memuat";
  }
}

document.getElementById("refreshBtn")
  .addEventListener("click",load);

searchInput.addEventListener("input",renderMatches);
leagueFilter.addEventListener("change",renderMatches);

load();

setInterval(load,30*60*1000);
</script>

</body>
</html>
